version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    # The shared ci-alerts action is pinned to a gigpies commit, so every gigpies
    # push looks like a new release. Bump it by hand when the action changes.
    ignore:
      - dependency-name: 'gigpies/gigpies*'
# Cargo source replacement is unsupported by Dependabot. See docs/CI.md.
# Weekly crates.io inventory remains enabled in cargo-versions.yml.
